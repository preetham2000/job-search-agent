[project]
name = "job-search-agent"
version = "0.1.0"
description = "AI-assisted job discovery, filtering, ranking, and alerting agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
job-search-agent = "job_search_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
